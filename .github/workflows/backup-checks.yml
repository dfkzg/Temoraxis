name: Backup checks
on:
  push:
    branches: [main]
    paths: ['tools/backup/**', 'tests/test_backup*.py', '.github/workflows/backup*.yml']
  pull_request:
    paths: ['tools/backup/**', 'tests/test_backup*.py', '.github/workflows/backup*.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install --yes age
      - run: python tests/test_backup.py
      - run: python tests/test_backup_roundtrip.py
