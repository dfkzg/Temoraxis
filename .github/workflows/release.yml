name: Publish Android release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-release
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/checks.yml
  release:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate version
        id: version
        run: |
          python tools/prepare_release.py --validate-only
          VERSION=$(python -c 'import json; print(json.load(open("release.json"))["version"])')
          TAG="v$VERSION"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$TAG" ]; then
            echo '::error::Tag and release.json version differ.'
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Check for an already published release
        id: existing
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/release-draft.txt" 2>/dev/null && grep -qx false "$RUNNER_TEMP/release-draft.txt"; then
            echo 'published=true' >> "$GITHUB_OUTPUT"
            echo 'This version is already published. Create a new version for changes.'
          else
            echo 'published=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Install Android SDK
        if: steps.existing.outputs.published != 'true'
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install platform tools
        if: steps.existing.outputs.published != 'true'
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Restore private signing key
        if: steps.existing.outputs.published != 'true'
        env:
          KEY_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          value = os.environ.get('KEY_BASE64', '')
          if not value:
              raise SystemExit('Add ANDROID_KEYSTORE_BASE64 in Settings > Secrets and variables > Actions. The signing key must match previously installed APKs.')
          key = Path(os.environ['RUNNER_TEMP']) / 'timeaxis-signing.keystore'
          key.write_bytes(base64.b64decode(value, validate=True))
          key.chmod(0o600)
          PY
      - name: Build and verify APK
        if: steps.existing.outputs.published != 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'android' }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'android' }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'androiddebugkey' }}
        run: |
          python stage_web.py
          python android/build.py --sdk "$ANDROID_HOME" --keystore "$RUNNER_TEMP/timeaxis-signing.keystore" --key-alias "$ANDROID_KEY_ALIAS" --output dist/timeaxis-android.apk
          python tools/check_signing.py dist/timeaxis-android.apk --sdk "$ANDROID_HOME"
          python tools/prepare_release.py
      - name: Publish complete release atomically
        if: steps.existing.outputs.published != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --draft --title "Timeaxis $VERSION" --notes-file dist/release-notes.md
          fi
          gh release upload "$TAG" dist/timeaxis-android.apk dist/timeaxis-complete-kit.zip dist/latest.json dist/SHA256SUMS.txt --clobber
          gh release edit "$TAG" --draft=false --latest
      - name: Remove private signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/timeaxis-signing.keystore"
