name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare and validate release sources
        run: |
          python stage_web.py
          python tools/prepare_release.py --validate-only
          python -m py_compile server/server.py server/admin.py
      - name: API tests
        run: python tests/test_server.py
      - name: Native reminder rules
        run: |
          curl --fail --location --retry 2 --output "$RUNNER_TEMP/json.jar" https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar
          python tools/check_test_dependency.py "$RUNNER_TEMP/json.jar"
          python tests/run_native_tests.py --json-jar "$RUNNER_TEMP/json.jar"
      - name: Permission setup flow
        run: python tests/run_permission_setup_tests.py
      - name: Browser tests
        run: |
          npm ci
          npx playwright install --with-deps chromium
          python tests/run_browser_tests.py
          node tests/browser_download_page.cjs
