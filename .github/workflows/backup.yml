name: Encrypted database backup
on:
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: database-backup
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check private configuration
        env:
          DATABASE: ${{ secrets.SUPABASE_BACKUP_DB_URL }}
          DRIVE: ${{ secrets.BACKUP_GOOGLE_DRIVE_JSON }}
          RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
        run: |
          python - <<'PY'
          import os
          if not all(os.environ.get(key) for key in ('DATABASE','DRIVE','RECIPIENT')):
              raise SystemExit('Backup is not configured. Follow docs/BACKUPS.md and add all three repository secrets.')
          PY
      - name: Install encryption and database tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes age
          docker pull postgres:17-alpine
      - name: Dump, encrypt, upload, verify and retain 14 copies
        env:
          SUPABASE_BACKUP_DB_URL: ${{ secrets.SUPABASE_BACKUP_DB_URL }}
          BACKUP_GOOGLE_DRIVE_JSON: ${{ secrets.BACKUP_GOOGLE_DRIVE_JSON }}
          BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
        run: python tools/backup/drive_backup.py
