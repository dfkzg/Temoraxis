plugins { id 'com.android.application' }
android {
    namespace 'ru.personal.planner'
    compileSdk 35
    defaultConfig { applicationId 'ru.personal.planner'; minSdk 26; targetSdk 35; versionCode 6; versionName '0.1.5' }
    sourceSets { main { manifest.srcFile 'src/main/AndroidManifest.gradle.xml' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    buildTypes { debug { debuggable true }; release { minifyEnabled false } }
}
